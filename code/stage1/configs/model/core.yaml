__target__: PGDModel

d_in: 0
d_out: 32
n_cls: 3
nsample: 16
architecture:
  - startblock
  - downsample
  - downsample
  - downsample
  - downsample
  - upsample
  - upsample
  - upsample
  - upsample
stride_list: [4, 3, 2, 1]
stride_dim_list: [1.5, 1.5, 1.5, 1.5]

encoder_type: naa
naa_k: 32
naa_group_backend: pointcloudlib
vq_ste: identity
naa_use_se: false

codebook_specs:
  - feature_dim: 108
    codebook_size: 512
  - feature_dim: 72
    codebook_size: 384
  - feature_dim: 48
    codebook_size: 256
  - feature_dim: 32
    codebook_size: 192
codebook_momentum: 0.99
codebook_use_ema: true
codebook_commitment_cost: 0.0
codebook_temperature: 0.1
codebook_reset_interval: 1000
codebook_dead_threshold: 5000
attn_mlp_hidden_mult: 1
num_neighbors: 16
interpolation_k: 8

patch_size: 1000
niters: 1
seed_k: 6
seed_k_alpha: 10
sampling_timesteps: 5
